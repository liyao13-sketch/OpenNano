name: CI

# 回归网（P1）。目标：**推上去能见绿灯**，且两条最基本的纪律可被机器守住——
#   ① 工具**不写**数据资产（CSV 权威在 ingest/，core/*.csv 是派生物）
#   ② 跨线指针**不许指到不存在的文件**
# 数据资产（个人空间/32_工艺数据资产）**不在仓库里**：依赖真源的用例如实跳过，
# 不假装通过（`pytest -rs` 会打印跳过原因）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 后端回归网
  server-tests:
    name: 后端回归网（py${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: 安装依赖
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 跑回归网
        working-directory: server
        run: python -m pytest tests -rs
      - name: 跨线指针校验（严格）
        working-directory: server
        # CI 里没有 32_工艺数据资产 ⇒ 允许"真源缺失"，但**禁用名回流**照样算红。
        # 本机（带真源）请**不带** --allow-missing 跑一次，期望 14/14 全命中。
        run: python -m kb.pointer_check --strict --allow-missing

  # ---------------------------------------------------------------- 前端构建
  web-build:
    name: 前端构建（tsc + vite）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 前端自测（正交路由 95 项）
        # 2026-09-16 审计发现：这个自测脚本此前**没接进任何地方** ⇒ 前端自动化测试为零。
        run: npm test
      - name: 构建
        run: npm run build
